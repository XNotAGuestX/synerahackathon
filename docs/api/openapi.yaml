      properties:
        kind:
          type: string
          const: add_object
        type:
          $ref: "#/components/schemas/EditReference"
        category:
          $ref: "#/components/schemas/OptionalEditReference"
        name:
          $ref: "#/components/schemas/OptionalEditReference"
        space:
          $ref: "#/components/schemas/OptionalEditReference"
        floor_id:
          $ref: "#/components/schemas/OptionalEditReference"
        position:
          oneOf:
            - $ref: "#/components/schemas/Point"
            - type: "null"
        rotation_deg:
          type: [number, "null"]
          default: 0
        width_m:
          $ref: "#/components/schemas/OptionalSize"
        depth_m:
          $ref: "#/components/schemas/OptionalSize"
        height_m:
          $ref: "#/components/schemas/OptionalSize"
          description: Gesetzt = Höhen-Override. null = Katalog-Höhe; die normalisierte Proposal behält dann null.
        on_top_of:
          $ref: "#/components/schemas/Supports"

