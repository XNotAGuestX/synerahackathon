          type: [string, "null"]
        selected_object_id:
          type: [string, "null"]
          description: Ausgewähltes Objekt, Tür oder Verbinder. Unbekannt ergibt 404 `30013_element_not_found`.
        preferences:
          oneOf:
            - $ref: "#/components/schemas/Preferences"
