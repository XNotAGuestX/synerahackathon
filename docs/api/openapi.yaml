openapi: 3.1.0
info:
  title: Track 01 Building Guide API
  version: 1.0.0
  summary: Sitzungs-API für Ortssuche, Route und bestätigte Änderungen.
  description: |
    Normative Form. Semantik, Fehlercodes und Idempotenz stehen in `docs/DESIGN.md`.
    Bei Widerspruch gelten Felder, Typen und Statuscodes dieser Datei.

    Koordinaten sind lokale Meter, x nach rechts, y nach oben, keine Geokoordinaten. Polygone sind nicht geschlossen.
    Erfolgsbodies tragen `schema_version: 1`. Clients ignorieren unbekannte Antwortfelder und unbekannte `effects[].type`.

    Optionale Auth: Ist `API_TOKEN` gesetzt, brauchen alle Aufrufe außer `GET /api/v1/health`
    `Authorization: Bearer <token>`. Beispiele enthalten kein echtes Token.
  license:
    name: Hackathon student kit
servers:
  - url: http://127.0.0.1:8000
    description: Lokale Backend-Adresse. Der Frontend-Mock startet diesen Prozess nicht.
tags:
  - name: Health
  - name: Buildings
  - name: Sessions
  - name: Plans
  - name: Places
  - name: Routes
  - name: Messages
  - name: Actions
  - name: Guidance
  - name: Catalog
paths:
  /api/v1/health:
    get:
      operationId: get_health
      tags: [Health]
      summary: Prozessprüfung
      description: Ruft das Modell nicht und verlangt kein Token.
      responses:
        "200":
          description: Prozess erreichbar
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                schema_version: 1
                status: ok
                api_version: "1"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/buildings:
    get:
      operationId: list_buildings
      tags: [Buildings]
      summary: Gebäude seitenweise listen
      description: Daten aus der Datensatzliste. Der Cursor ist opak.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/LimitDefault20"
        - name: split
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Split"
          description: Nur diese Teilung. Fehlt der Parameter, kommen alle Teilungen.
      responses:
        "200":
          description: Eine Seite Gebäudekurzinfos
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildingPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/buildings/{building_id}:
    get:
      operationId: get_building
      tags: [Buildings]
      summary: Etagenindex eines Gebäudes lesen
      description: Ohne Raumpolygone. Geometrie kommt aus dem Floor-Plan der Sitzung.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/BuildingId"
      responses:
        "200":
          description: Gebäudedetail
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildingDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/object-types:
    get:
      operationId: list_object_types
      tags: [Catalog]
      summary: Objekt- und Verbindungstypen des Editors lesen
      description: |
        Katalog aus `final_agent/object_types.json`, ohne Sitzung. Gruppe `items` enthält Objekttypen
        (`action: add_object`) mit Default-Maßen und Default-Höhe. Gruppe `connections` enthält Tür und Durchgang
        (`add_opening`) sowie Treppe, Rolltreppe und Aufzug (`add_connector`); deren `height_m` ist null.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
      responses:
        "200":
          description: Objektkatalog
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectCatalog"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sessions:
    post:
      operationId: create_session
      tags: [Sessions]
      summary: Sitzung für ein Gebäude öffnen
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreate"
            example:
              building_id: proc-factory-dev-003
              preferences:
                step_free: true
      responses:
        "201":
          description: Sitzung angelegt. Derselbe Idempotenzschlüssel liefert das erste Ergebnis.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{session_id}:
    get:
      operationId: get_session
      tags: [Sessions]
      summary: Sitzungszustand lesen
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Aktuelle Sitzung
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: delete_session
      tags: [Sessions]
      summary: Sitzung löschen
      description: Idempotent. Fehlt die Sitzung bereits, ist die Antwort trotzdem 204.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Sitzung ist weg
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{session_id}/preferences:
    put:
      operationId: put_preferences
      tags: [Sessions]
      summary: Stufenfrei-Präferenz ersetzen
      description: |
        Ersetzt das ganze Objekt. Derselbe Body ergibt denselben Zustand.
        Wirkt nur auf spätere Routen und den Nachrichten-Default, nicht auf schon berechnete Routen.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/If-Match"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "200":
          description: Aktualisierte Sitzung
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{session_id}/floors:
    get:
      operationId: list_floors
      tags: [Plans]
      summary: Etagen des Sitzungsgebäudes listen
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Etagenindex
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloorIndex"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{session_id}/floors/{floor_id}/plan:
    get:
      operationId: get_floor_plan
      tags: [Plans]
      summary: Zeichenbare Geometrie einer Etage lesen
      description: |
        Enthält bestätigte neue Türen dieser revision. `closed_ids` ist die volle Schließmenge der Sitzung derselben revision.
        Nicht angeforderte Arrays bleiben vorhanden, sind aber leer. `included` trennt „nicht angefordert“ von „wirklich leer“.
        `stacking` ist immer vorhanden und hängt nicht von `include` ab.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/FloorId"
        - name: include
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/PlanInclude"
          description: Kommagetrennt. Fehlt der Parameter, kommen alle vier Arten.
      responses:
        "200":
          description: Plan dieser Etage
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloorPlan"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{session_id}/places:
    get:
      operationId: search_places
      tags: [Places]
      summary: Räume und Geräte suchen
      description: Kein Treffer ist 200 mit leeren `items`, kein 404.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/SessionId"
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: Jedes Wort muss in Name, Nummer oder Typ vorkommen.
        - name: floor_level
          in: query
          required: false
          schema:
            type: integer
          description: Nur diese Etage. 0 ist das Erdgeschoss, negative Werte sind Untergeschosse.
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PlaceKind"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/LimitDefault15"
      responses:
        "200":
          description: Eine Seite Orte
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacePage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{session_id}/routes:
    post:
      operationId: create_route
      tags: [Routes]
      summary: Eine Route berechnen
      description: |
        Ruft das Modell nicht. Start und Ziel nehmen eine space id, asset id oder eine eindeutige Raumnummer bzw. einen eindeutigen Namen.
        Aufgelöst, aber unerreichbar: 201, `reachable: false`, `length_m` null, `legs` leer.
        Mehrdeutiger Name: 409 `30005_place_ambiguous`, keine Route wird angelegt.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/If-Match"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteCreate"
            example:
              start: proc-factory-dev-003-F0-S012
              destination: proc-factory-dev-003-A00001
              step_free: true
              via: []
      responses:
        "201":
          description: Route-Ressource. `reachable` darf false sein.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{session_id}/routes/{route_id}:
    get:
      operationId: get_route
      tags: [Routes]
      summary: Eine berechnete Route lesen
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/RouteId"
      responses:
        "200":
          description: Route
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{session_id}/messages:
    get:
      operationId: list_messages
      tags: [Messages]
      summary: Dialog seitenweise lesen
      description: Zeitlich aufsteigend. Guidesätze tragen understood und effects, keine eingebettete Polylinie.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/LimitDefault20"
      responses:
        "200":
          description: Eine Seite Nachrichten
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: create_message
      tags: [Messages]
      summary: Einen Satz senden
      description: |
        Fällt das Modell aus, ist die Antwort 429, 503 oder 504. Keine ausstehende Aktion, keine Änderung an closed_ids.
        Ein unklarer Ort bleibt 201, intent ist clarify oder unknown.
        Eine satzweise Stufenfrei-Übersteuerung steht in client_context.preferences und ändert den Sitzungsdefault nicht.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/If-Match"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCreate"
            example:
              text: I am at the main entrance. How do I reach the CNC mill without stairs?
              input_mode: text
              client_context:
                floor_level: 0
                selected_space_id: proc-factory-dev-003-F0-S012
                selected_object_id: null
                preferences:
                  step_free: true
      responses:
        "201":
          description: Nutzersatz angenommen, mit Guide-Antwort.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageAccepted"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ModelUnavailable"
        "504":
          $ref: "#/components/responses/ModelTimeout"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{session_id}/actions:
    post:
      operationId: create_action
      tags: [Actions]
      summary: Eine Änderung vorschlagen
      description: |
        Legt nur eine pending-Aktion an und ändert das Gebäude nicht.
        Teilen die Räume keine Wand, ist die Antwort 409 `30007_not_adjacent` und es entsteht keine Aktion.
        Die Aktion läuft nach 15 Minuten ab.
        Editor-Kinds (`add_object`, `update_object`, `remove_object`, `add_opening`, `add_connector`, `undo_edit`)
        werden auf einer Kopie geprüft. Die Aktion speichert die normalisierte Proposal (Ids statt Namen,
        berechnete Position, gefüllte Defaults) und zeigt den Zustand danach in `preview_objects`.
        Verletzte Regeln: 409 `30014_invalid_placement` mit `details[].code` = Regel, 409 `30015_nothing_to_undo`,
        409 `30016_not_removable`, 404 `30013_element_not_found` oder `30004_place_not_found` mit `details[].field`.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/If-Match"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionCreate"
            examples:
              closeLift:
                summary: Büroaufzug zum Schließen vorschlagen
                value:
                  kind: set_closed
                  element_ref: proc-factory-dev-003-V02
                  closed: true
              addDoor:
                summary: Tür vorschlagen
                value:
                  kind: add_door
                  first_space: "1.04"
                  second_space: "1.05"
                  step_free: true
              addObject:
                summary: Schreibtisch in einem Raum vorschlagen
                value:
                  kind: add_object
                  type: desk
                  space: "1.04"
              stackObject:
                summary: Drucker auf einen Schreibtisch stellen
                value:
                  kind: update_object
                  object_ref: Printer 1.04
                  on_top_of: [Desk 1.04]
              undoEdit:
                summary: Letzte Editor-Änderung rückgängig machen
                value:
                  kind: undo_edit
      responses:
        "201":
          description: Ausstehende Aktion
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{session_id}/actions/{action_id}:
    get:
      operationId: get_action
      tags: [Actions]
      summary: Eine Aktion lesen
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/ActionId"
      responses:
        "200":
          description: Aktion
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{session_id}/actions/{action_id}/confirmations:
    post:
      operationId: confirm_action
      tags: [Actions]
      summary: Aktion bestätigen und anwenden
      description: |
        Dieselbe schon bestätigte Aktion noch einmal bestätigen liefert das erste Ergebnis und keine zweite Tür.
        Gebäudeänderungen (`add_door` und die Editor-Kinds) schreiben in derselben Transaktion
        `agent_output/api/<session_id>/building_edited.json` und `stacking_adapter.json`.
        Scheitert das Speichern: Rollback, 500 `00001_internal`, die Aktion bleibt pending.
        Bestätigen nach Abbruch: 409 `30010_action_conflict`.
        Confirm after cancel: 409 `30010_action_conflict`.
        Abgelaufen: 409 `30009_action_expired`.
        Expired: 409 `30009_action_expired`.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/ActionId"
        - $ref: "#/components/parameters/If-Match"
      responses:
        "200":
          description: Bestätigte Aktion, inklusive result
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{session_id}/actions/{action_id}/cancellations:
    post:
      operationId: cancel_action
      tags: [Actions]
      summary: Ausstehende Aktion abbrechen
      description: Ändert das Gebäude nicht. Erneutes Abbrechen liefert das erste Abbruchergebnis.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/ActionId"
        - $ref: "#/components/parameters/If-Match"
      responses:
        "200":
          description: Abgebrochene Aktion
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{session_id}/position:
    put:
      operationId: put_position
      tags: [Guidance]
      summary: Aktuelle Position melden
      description: |
        Ersetzt die zuletzt bekannte Position. Ändert nie `revision`. Eine Messung, die nicht jünger ist als die
        gespeicherte, ergibt `applied: false` und lässt die Position unverändert. `measured_at` darf höchstens 2 s in der Zukunft liegen.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionFix"
      responses:
        "200":
          description: Gespeicherte Position und Stand der Führung
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionAccepted"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{session_id}/guidance:
    get:
      operationId: get_guidance
      tags: [Guidance]
      summary: Führung und neue Ansagen lesen
      description: |
        Long-Poll: Gibt es keine Ereignisse mit `seq > after`, wartet der Server bis zu `wait_s` Sekunden.
        Ändert nie `revision`.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/SessionId"
        - name: after
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Letzte bekannte `seq`.
        - name: wait_s
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 25
            default: 0
      responses:
        "200":
          description: Führung, Ereignisse und Cursor
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuidanceFeed"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: put_guidance
      tags: [Guidance]
      summary: Führung für eine Route starten
      description: |
        Ersetzt eine laufende Führung. Eine unerreichbare Route ist 20001 mit `route_id` und Code `unreachable`.
        Die Antwort enthält schon die erste Ansage. Ändert nie `revision`.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuidanceStart"
      responses:
        "200":
          description: Gestartete Führung mit den bisherigen Ereignissen
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuidanceFeed"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: delete_guidance
      tags: [Guidance]
      summary: Führung beenden
      description: Idempotent. Ohne laufende Führung ist die Antwort trotzdem 204.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Keine Führung mehr
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{session_id}/transcriptions:
    post:
      operationId: create_transcription
      tags: [Guidance]
      summary: Gesprochene Eingabe in Text umwandeln
      description: |
        Der Body ist rohes Audio (WAV, WebM, Ogg, MP4 oder MP3), höchstens 2 MiB. Ändert nie `revision`.
        Der Text wird danach wie eine Eingabe mit `input_mode: voice` an `create_message` gesendet.
        Ohne konfigurierten Sprachdienst oder bei dessen Ausfall ist die Antwort 503 `40004_speech_unavailable`
        mit `details[0].code` als Grund (not_configured, auth, rate_limited, timeout, provider_error, bad_audio).
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          audio/wav:
            schema: {type: string, format: binary}
          audio/x-wav:
            schema: {type: string, format: binary}
          audio/webm:
            schema: {type: string, format: binary}
          audio/ogg:
            schema: {type: string, format: binary}
          audio/mp4:
            schema: {type: string, format: binary}
          audio/mpeg:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Erkannter Text (kann leer sein)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcription"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/SpeechUnavailable"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{session_id}/speech-clips/{clip_id}:
    get:
      operationId: get_speech_clip
      tags: [Guidance]
      summary: Gesprochenen Clip abrufen
      description: |
        Liefert die Sprachausgabe (MP3) zu einem `speech_clip_id` aus einer Führungsmeldung oder einer Sprachantwort.
        Der Clip wird beim ersten Abruf erzeugt und zwischengespeichert. Unbekannte oder abgelaufene Clips sind 404 `30017_speech_clip_not_found`.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/SessionId"
        - name: clip_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        "200":
          description: MP3-Audio
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
            X-Schema-Version:
              $ref: "#/components/headers/X-Schema-Version"
          content:
            audio/mpeg:
              schema: {type: string, format: binary}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SpeechUnavailable"
        default:
          $ref: "#/components/responses/Error"

components:
  parameters:
    X-Request-Id:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Optional vom Client. Fehlt der Wert, erzeugt ihn der Server und schreibt ihn in den Antwortheader und in trace_id.
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[\\x21-\\x7E]+$"
      description: |
        Bei POST Pflicht. Erfolgreiche 2xx werden 24 Stunden dedupliziert. Gleicher Schlüssel, anderer Body: 20011.
        5xx, 429 und 30012 belegen keinen Eintrag. Derselbe Schlüssel darf wiederholt werden.
        5xx, 429, and 30012 are not stored. The same key may be retried.
    If-Match:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
        examples:
          - '"1"'
      description: Quoted Sitzungs-revision, gleich wie ETag. Bei Abweichung 409 `30012_revision_conflict`.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 512
      description: next_cursor der vorigen Seite. Opak.
    LimitDefault20:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    LimitDefault15:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 15
    BuildingId:
      name: building_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/BuildingId"
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ResourceId"
    FloorId:
      name: floor_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/DatasetId"
    RouteId:
      name: route_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ResourceId"
    ActionId:
      name: action_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ResourceId"

  headers:
    X-Request-Id:
      description: Gleich wie trace_id im Fehlerpaket.
      schema:
        type: string
    X-API-Version:
      description: URL-Hauptversion.
      schema:
        type: string
        const: "1"
    X-Schema-Version:
      description: schema_version des Erfolgsbodies.
      schema:
        type: string
        const: "1"
    ETag:
      description: Quoted Sitzungs-revision, zum Beispiel "1".
      schema:
        type: string
    Location:
      description: Pfad der neuen Ressource.
      schema:
        type: string
    Retry-After:
      description: Sekunden.
      schema:
        type: integer
        minimum: 0

  responses:
    Error:
      description: Nicht einzeln aufgeführter Fehler
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: Request ungültig
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 20001_validation_failed
            message: Request validation failed.
            trace_id: "11111111-1111-4111-8111-1111111111a1"
            details:
              - field: text
                code: too_long
    Unauthenticated:
      description: Nicht authentifiziert
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 10001_unauthenticated
            message: Authentication is required.
            trace_id: "11111111-1111-4111-8111-1111111111a1"
            details: []
    NotFound:
      description: Ressource fehlt
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 30002_session_not_found
            message: Session was not found.
            trace_id: "11111111-1111-4111-8111-1111111111a1"
            details: []
    Conflict:
      description: Konflikt, Mehrdeutigkeit oder Idempotenzschlüssel passt nicht
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 30005_place_ambiguous
            message: Place reference is ambiguous.
            trace_id: "11111111-1111-4111-8111-1111111111a1"
            details:
              - field: destination
                code: ambiguous
    PayloadTooLarge:
      description: Body über dem Limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 20012_payload_too_large
            message: Request body exceeds 65536 bytes.
            trace_id: "11111111-1111-4111-8111-1111111111a1"
            details: []
    RateLimited:
      description: Limit erreicht
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 40002_model_rate_limited
            message: Model rate limit exceeded.
            trace_id: "11111111-1111-4111-8111-1111111111a1"
            details: []
    ModelUnavailable:
      description: Modell nicht erreichbar
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 40001_model_unavailable
            message: Model is unavailable.
            trace_id: "11111111-1111-4111-8111-1111111111a1"
            details: []
    SpeechUnavailable:
      description: Sprachdienst nicht verfügbar
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 40004_speech_unavailable
            message: Speech service is unavailable.
            trace_id: "11111111-1111-4111-8111-1111111111a1"
            details:
              - field: speech
                code: not_configured
    ModelTimeout:
      description: Modell-Timeout
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 40003_model_timeout
            message: Model timed out.
            trace_id: "11111111-1111-4111-8111-1111111111a1"
            details: []

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [schema_version, status, api_version]
      properties:
        schema_version:
          type: integer
          const: 1
        status:
          type: string
          enum: [ok]
        api_version:
          type: string
          const: "1"

    Error:
      type: object
      additionalProperties: false
      required: [code, message, trace_id, details]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Festes Englisch, nur für Logs. Die Oberfläche verzweigt auf code.
        trace_id:
          type: string
          minLength: 1
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        field:
          type: [string, "null"]
        code:
          type: string
          description: Feldcode, zum Beispiel required, too_long, unknown_field, not_in_whitelist, ambiguous.
        message:
          type: string

    ErrorCode:
      type: string
      enum:
        - 00001_internal
        - 00002_rate_limited
        - 10001_unauthenticated
        - 10002_forbidden
        - 20001_validation_failed
        - 20010_idempotency_key_required
        - 20011_idempotency_key_mismatch
        - 20012_payload_too_large
        - 30001_building_not_found
        - 30002_session_not_found
        - 30003_floor_not_found
        - 30004_place_not_found
        - 30005_place_ambiguous
        - 30007_not_adjacent
        - 30008_action_not_found
        - 30009_action_expired
        - 30010_action_conflict
        - 30012_revision_conflict
        - 30013_element_not_found
        - 30014_invalid_placement
        - 30015_nothing_to_undo
        - 30016_not_removable
        - 30017_speech_clip_not_found
        - 40001_model_unavailable
        - 40002_model_rate_limited
        - 40003_model_timeout
        - 40004_speech_unavailable

    Split:
      type: string
      enum: [train, dev, test]

    PlanInclude:
      type: string
      enum: [spaces, openings, assets, connectors]

    PlaceKind:
      type: string
      enum: [space, asset]

    BuildingId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"

    DatasetId:
      type: string
      minLength: 1
      maxLength: 160

    ResourceId:
      type: string
      format: uuid

    Point:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: number
      description: "[x, y], Meter. x nach rechts, y nach oben."

    Polygon:
      type: array
      minItems: 3
      items:
        $ref: "#/components/schemas/Point"
      description: Umriss, der erste Punkt wird nicht wiederholt.

    Bounds:
      type: object
      additionalProperties: false
      required: [min, max]
      properties:
        min:
          $ref: "#/components/schemas/Point"
        max:
          $ref: "#/components/schemas/Point"

    Preferences:
      type: object
      additionalProperties: false
      required: [step_free]
      properties:
        step_free:
          type: boolean

    BuildingSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - source
        - split
        - license
        - level_count
        - levels
        - space_count
        - asset_count
        - has_stairs
        - has_lift
        - has_step_free_entrance
      properties:
        id:
          $ref: "#/components/schemas/BuildingId"
        name:
          type: string
        source:
          type: string
        split:
          $ref: "#/components/schemas/Split"
        license:
          type: string
        level_count:
          type: integer
          minimum: 1
        levels:
          type: array
          items:
            type: integer
        space_count:
          type: integer
          minimum: 0
        asset_count:
          type: integer
          minimum: 0
        has_stairs:
          type: boolean
        has_lift:
          type: boolean
        has_step_free_entrance:
          type: boolean

    BuildingPage:
      type: object
      additionalProperties: false
      required: [schema_version, items, next_cursor, has_more]
      properties:
        schema_version:
          type: integer
          const: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/BuildingSummary"
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean

    FloorIndexItem:
      type: object
      additionalProperties: false
      required: [id, level, name, elevation_m, height_m, space_count]
      properties:
        id:
          $ref: "#/components/schemas/DatasetId"
        level:
          type: integer
        name:
          type: string
        elevation_m:
          type: number
        height_m:
          type: number
        space_count:
          type: integer
          minimum: 0

    BuildingDetail:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - id
        - name
        - source
        - split
        - license
        - level_count
        - levels
        - space_count
        - asset_count
        - has_stairs
        - has_lift
        - has_step_free_entrance
        - units
        - attribution
        - floors
      properties:
        schema_version:
          type: integer
          const: 1
        id:
          $ref: "#/components/schemas/BuildingId"
        name:
          type: string
        source:
          type: string
        split:
          $ref: "#/components/schemas/Split"
        license:
          type: string
        level_count:
          type: integer
          minimum: 1
        levels:
          type: array
          items:
            type: integer
        space_count:
          type: integer
          minimum: 0
        asset_count:
          type: integer
          minimum: 0
        has_stairs:
          type: boolean
        has_lift:
          type: boolean
        has_step_free_entrance:
          type: boolean
        units:
          type: string
          const: m
        attribution:
          type: string
        floors:
          type: array
          items:
            $ref: "#/components/schemas/FloorIndexItem"

    SessionCreate:
      type: object
      additionalProperties: false
      required: [building_id]
      description: |
        Fehlt preferences, setzt der Server step_free auf false.
      properties:
        building_id:
