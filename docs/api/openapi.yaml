        on_top_of:
          type: array
          items:
            type: string
          description: Ids der Träger, sortiert. Leer auf Ebene 0.
        height_m:
          type: number
          exclusiveMinimum: 0
          description: Wirksame Höhe in Metern.
        height_source:
          type: string
          enum: [override, catalog]
          description: override = vom Nutzer gesetzt, catalog = Default des Typs.
        elevation_m:
          type: number
          minimum: 0
          description: Unterkante über dem Etagenboden = größte Oberkante der Träger.

