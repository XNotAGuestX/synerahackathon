          type: array
          items:
            $ref: "#/components/schemas/StackingEntry"
          description: |
            Objekte dieser Etage aus `stacking_adapter.json`: gestapelt, tragend oder mit Höhen-Override.
            Alle anderen Objekte stehen am Boden und haben die Katalog-Höhe ihres Typs (`GET /api/v1/object-types`).

