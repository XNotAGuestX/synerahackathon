      type: object
      additionalProperties: false
      required: [kind]
      description: Tür oder Durchgang. Entweder first_space und second_space, oder floor_id und position auf der Wand.
      properties:
        kind:
          type: string
          const: add_opening
        opening_kind:
          type: [string, "null"]
          enum: [door, opening, null]
          default: door
        first_space:
          $ref: "#/components/schemas/OptionalEditReference"
        second_space:
          $ref: "#/components/schemas/OptionalEditReference"
        floor_id:
          $ref: "#/components/schemas/OptionalEditReference"
        position:
          oneOf:
            - $ref: "#/components/schemas/Point"
            - type: "null"
        width_m:
          $ref: "#/components/schemas/OptionalSize"
        step_free:
          type: [boolean, "null"]
          default: true

    AddConnectorProposal:
      type: object
      additionalProperties: false
      required: [kind, connector_kind, spaces]
      description: Treppe, Rolltreppe oder Aufzug zwischen übereinanderliegenden Räumen verschiedener Etagen.
      properties:
        kind:
          type: string
          const: add_connector
        connector_kind:
          type: string
          enum: [stairs, escalator, lift]
        spaces:
          type: array
          minItems: 2
          maxItems: 64
          items:
            $ref: "#/components/schemas/EditReference"
        name:
          $ref: "#/components/schemas/OptionalEditReference"
        step_free:
          type: [boolean, "null"]
          description: Nur Aufzug, Default true. Treppe und Rolltreppe sind nie stufenfrei.

    UndoEditProposal:
      type: object
      additionalProperties: false
      required: [kind]
      description: Macht die letzte bestätigte Gebäudeänderung der Sitzung rückgängig. Schließungen bleiben.
      properties:
        kind:
          type: string
          const: undo_edit

    EditReference:
      type: string
      minLength: 1
      maxLength: 200
      description: Id oder genauer Name.

    OptionalEditReference:
      type: [string, "null"]
      minLength: 1
      maxLength: 200

    OptionalSize:
      type: [number, "null"]
      exclusiveMinimum: 0
      description: Meter, größer als 0.

    Supports:
      type: [array, "null"]
      maxItems: 20
      items:
        $ref: "#/components/schemas/EditReference"
      description: Objekte, auf denen das Objekt steht, alle im selben Raum.

    ActionCreate:
      oneOf:
        - $ref: "#/components/schemas/SetClosedProposal"
        - $ref: "#/components/schemas/AddDoorProposal"
        - $ref: "#/components/schemas/AddObjectProposal"
        - $ref: "#/components/schemas/UpdateObjectProposal"
        - $ref: "#/components/schemas/RemoveObjectProposal"
        - $ref: "#/components/schemas/AddOpeningProposal"
        - $ref: "#/components/schemas/AddConnectorProposal"
        - $ref: "#/components/schemas/UndoEditProposal"
      discriminator:
        propertyName: kind
        mapping:
          set_closed: "#/components/schemas/SetClosedProposal"
          add_door: "#/components/schemas/AddDoorProposal"
          add_object: "#/components/schemas/AddObjectProposal"
          update_object: "#/components/schemas/UpdateObjectProposal"
          remove_object: "#/components/schemas/RemoveObjectProposal"
          add_opening: "#/components/schemas/AddOpeningProposal"
          add_connector: "#/components/schemas/AddConnectorProposal"
          undo_edit: "#/components/schemas/UndoEditProposal"

    SetClosedResult:
      type: object
      additionalProperties: false
      required: [kind, element_id, closed, closed_ids]
      properties:
        kind:
          type: string
          const: set_closed
        element_id:
          type: string
        closed:
          type: boolean
        closed_ids:
          type: array
          items:
            type: string

    AddDoorResult:
      type: object
      additionalProperties: false
      required: [kind, opening]
      properties:
        kind:
          type: string
          const: add_door
        opening:
          $ref: "#/components/schemas/Opening"

    EditResult:
      type: object
      additionalProperties: false
      required: [kind, summary, changed_ids, removed_ids, floor_ids]
      properties:
        kind:
          type: string
          enum: [add_object, update_object, remove_object, add_opening, add_connector, undo_edit]
        summary:
          type: string
          description: "Ein englischer Satz, z. B. `Add Desk 0.02 in Office 0.02.` oder `Undo: …`."
        changed_ids:
          type: array
          items:
            type: string
          description: Neue oder geänderte Objekte, Öffnungen und Verbinder, inklusive mitbewegter Stapel.
        removed_ids:
          type: array
          items:
            type: string
        floor_ids:
          type: array
          items:
            type: string
          description: Diese Etagen per GET plan neu laden.

    ActionResult:
      oneOf:
        - $ref: "#/components/schemas/SetClosedResult"
        - $ref: "#/components/schemas/AddDoorResult"
        - $ref: "#/components/schemas/EditResult"
      discriminator:
        propertyName: kind
        mapping:
          set_closed: "#/components/schemas/SetClosedResult"
          add_door: "#/components/schemas/AddDoorResult"
          add_object: "#/components/schemas/EditResult"
          update_object: "#/components/schemas/EditResult"
          remove_object: "#/components/schemas/EditResult"
          add_opening: "#/components/schemas/EditResult"
          add_connector: "#/components/schemas/EditResult"
          undo_edit: "#/components/schemas/EditResult"

    ObjectCatalog:
      type: object
      additionalProperties: false
      required: [schema_version, groups]
      properties:
        schema_version:
          type: integer
          const: 1
        groups:
          type: array
          items:
            $ref: "#/components/schemas/ObjectCatalogGroup"
          description: Bekannte Gruppen items und connections.

    ObjectCatalogGroup:
      type: object
      additionalProperties: false
      required: [id, label, categories]
      properties:
        id:
          type: string
        label:
          type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/ObjectCatalogCategory"

    ObjectCatalogCategory:
      type: object
      additionalProperties: false
      required: [id, label, height_m, types]
      properties:
        id:
          type: string
          description: Objekte furniture, equipment, fixture, machine. Verbindungen same_floor, between_floors.
        label:
          type: string
        height_m:
          type: [number, "null"]
          description: Fallback-Höhe für Typen dieser Kategorie ohne eigene Höhe. Verbindungen null.
        types:
          type: array
          items:
            $ref: "#/components/schemas/ObjectCatalogType"

    ObjectCatalogType:
      type: object
      additionalProperties: false
      required: [id, label, action, width_m, depth_m, height_m, count]
      properties:
        id:
          type: string
          description: Wert für `type` (add_object), `opening_kind` (add_opening) oder `connector_kind` (add_connector).
        label:
          type: string
        action:
          type: string
          enum: [add_object, add_opening, add_connector]
        width_m:
          type: [number, "null"]
          description: Typische Breite im Datensatz in Metern.
        depth_m:
          type: [number, "null"]
        height_m:
          type: [number, "null"]
          description: Default-Höhe in Metern. Verbindungen null.
        count:
          type: integer
          minimum: 0
          description: Anzahl im Datensatz (train und dev).

    Action:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - id
        - session_id
        - status
        - summary
        - proposal
        - preview_effects
        - result
        - created_at
        - expires_at
        - resolved_at
      properties:
        schema_version:
          type: integer
          const: 1
        id:
          $ref: "#/components/schemas/ResourceId"
        session_id:
          $ref: "#/components/schemas/ResourceId"
        status:
          type: string
          enum: [pending, confirmed, cancelled, expired]
        summary:
          type: string
          description: Ein englischer Satz für die Bestätigungskarte.
        proposal:
          $ref: "#/components/schemas/ActionCreate"
        preview_effects:
          type: array
          items:
            $ref: "#/components/schemas/ViewEffect"
        result:
          oneOf:
            - $ref: "#/components/schemas/ActionResult"
            - type: "null"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        resolved_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"

    PositionFix:
      type: object
      additionalProperties: false
      required: [floor_id, x_m, y_m, measured_at, source]
      properties:
        floor_id:
          $ref: "#/components/schemas/DatasetId"
        x_m:
          type: number
        y_m:
          type: number
        accuracy_m:
          type: [number, "null"]
          minimum: 0
        measured_at:
          type: string
          format: date-time
        source:
          type: string
          enum: [simulated, wifi, manual]

    LivePosition:
      type: object
      additionalProperties: false
      required: [floor_id, x_m, y_m, accuracy_m, space_id, measured_at, received_at, source, tracking]
      properties:
        floor_id:
          $ref: "#/components/schemas/DatasetId"
        x_m:
          type: number
        y_m:
          type: number
        accuracy_m:
          type: [number, "null"]
        space_id:
          type: [string, "null"]
          description: Raum, der den Punkt enthält. null außerhalb jedes Raums.
        measured_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        source:
          type: string
          enum: [simulated, wifi, manual]
        tracking:
          type: string
          enum: [live, stale]
          description: stale, wenn die Messung älter als 15 s ist.

    Transcription:
      type: object
      additionalProperties: false
      required: [schema_version, text, language]
      properties:
        schema_version:
          type: integer
          const: 1
        text:
          type: string
        language:
          type: string
          const: en

    PositionAccepted:
      type: object
      additionalProperties: false
      required: [schema_version, position, applied, guidance]
      properties:
        schema_version:
          type: integer
          const: 1
        position:
          $ref: "#/components/schemas/LivePosition"
        applied:
          type: boolean
        guidance:
          type: object
          additionalProperties: false
          required: [status, target_index, remaining_m, cursor]
          properties:
            status:
              $ref: "#/components/schemas/GuidanceStatus"
            target_index:
              type: [integer, "null"]
            remaining_m:
              type: [number, "null"]
            cursor:
              type: integer
              minimum: 0
              description: Jüngste `seq` der Ereignisse.

    GuidanceStart:
      type: object
      additionalProperties: false
      required: [route_id]
      properties:
        route_id:
          type: string
          minLength: 1
          maxLength: 200

    GuidanceStatus:
      type: string
      enum: [idle, active, arrived, stopped]

    GuidanceWaypoint:
      type: object
      additionalProperties: false
      required: [index, kind, floor_id, at, text]
      properties:
        index:
          type: integer
          minimum: 0
        kind:
          type: string
          enum: [turn, door, connector_entry, connector_exit, stop, arrival]
        floor_id:
          $ref: "#/components/schemas/DatasetId"
        at:
          $ref: "#/components/schemas/Point"
        text:
          type: string
          description: Ansage, die gilt, sobald dieser Punkt das Ziel wird.

    Guidance:
      type: object
      additionalProperties: false
      required: [status, route_id, destination_space_id, destination_name, target_index, waypoints, remaining_m, tracking]
      properties:
        status:
          $ref: "#/components/schemas/GuidanceStatus"
        route_id:
          type: [string, "null"]
        destination_space_id:
          type: [string, "null"]
        destination_name:
          type: [string, "null"]
        target_index:
          type: [integer, "null"]
        waypoints:
          type: array
          items:
            $ref: "#/components/schemas/GuidanceWaypoint"
        remaining_m:
          type: [number, "null"]
        tracking:
          type: string
          enum: [none, live, stale]

    GuidanceEvent:
      type: object
      additionalProperties: false
      required: [seq, kind, text, route_id, waypoint_index, speech_clip_id, created_at]
      properties:
        seq:
          type: integer
          minimum: 1
        kind:
          type: string
          enum: [instruction, wrong_way, arrived, stopped]
        text:
          type: string
        route_id:
          type: [string, "null"]
        waypoint_index:
          type: [integer, "null"]
        speech_clip_id:
          type: string
        created_at:
          type: string
          format: date-time

    GuidanceFeed:
      type: object
      additionalProperties: false
      required: [schema_version, guidance, events, cursor]
      properties:
        schema_version:
          type: integer
          const: 1
        guidance:
          $ref: "#/components/schemas/Guidance"
        events:
          type: array
          items:
            $ref: "#/components/schemas/GuidanceEvent"
        cursor:
          type: integer
          minimum: 0
          description: Jüngste `seq`. Der nächste Aufruf nutzt sie als `after`.
