          description: Clip der Guide-Antwort für `get_speech_clip`, nur bei Eingabe per Sprache (input_mode voice), sonst null.
        session:
          $ref: "#/components/schemas/Session"
        user_message:
          $ref: "#/components/schemas/TranscriptMessage"
        guide_message:
          $ref: "#/components/schemas/TranscriptMessage"
        routes:
          type: array
          items:
            $ref: "#/components/schemas/Route"
          description: Routen, die effects dieser Antwort zitieren. Beim Reload GET route verwenden.
        pending_action:
          oneOf:
            - $ref: "#/components/schemas/Action"
            - type: "null"
        usage:
