        Objekt: name, type, category, space, floor_id, position, rotation_deg, width_m, depth_m, height_m, on_top_of.
        Öffnung: opening_kind, width_m, step_free. Verbinder: name, step_free. Andere Felder ergeben 400.
      properties:
        kind:
          type: string
          const: update_object
        object_ref:
          $ref: "#/components/schemas/EditReference"
        name:
          $ref: "#/components/schemas/OptionalEditReference"
        type:
          $ref: "#/components/schemas/OptionalEditReference"
        category:
          $ref: "#/components/schemas/OptionalEditReference"
        space:
          $ref: "#/components/schemas/OptionalEditReference"
        floor_id:
          $ref: "#/components/schemas/OptionalEditReference"
        position:
          oneOf:
            - $ref: "#/components/schemas/Point"
            - type: "null"
        rotation_deg:
          type: [number, "null"]
        width_m:
          $ref: "#/components/schemas/OptionalSize"
        depth_m:
          $ref: "#/components/schemas/OptionalSize"
        height_m:
          $ref: "#/components/schemas/OptionalSize"
          description: Setzt einen Höhen-Override.
        on_top_of:
          $ref: "#/components/schemas/Supports"
          description: Neue Träger. Leere Liste stellt das Objekt auf den Boden.
        step_free:
          type: [boolean, "null"]
        opening_kind:
          type: [string, "null"]
          enum: [door, opening, null]

