[project]
name = "track01-student-kit"
version = "1.1.0"
description = "Track 01 Google Maps for Every Building: project agent and scorer"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "fastembed>=0.9.1",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.0",
    "qdrant-client>=1.20.0",
    "shapely>=2.2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["final_agent", "benchmark"]

[tool.hatch.build.targets.wheel.force-include]
"openapi.yaml" = "final_agent/openapi.yaml"
